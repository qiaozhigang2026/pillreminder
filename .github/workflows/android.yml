name: Android Buildozer APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk python3-pip autoconf automake cmake build-essential libffi-dev libssl-dev libsqlite3-dev libltdl-dev libtool pkg-config unzip zip
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
      - name: Install Buildozer and Cython
        run: |
          pip3 install --upgrade pip
          pip3 install cython==0.29.37 buildozer
      - name: Build APK
        run: buildozer -v android debug 2>&1 | tee buildozer_build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pill-reminder-app
          path: .buildozer/android/platform/build-arm64-v8a/dists/pillreminder/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
