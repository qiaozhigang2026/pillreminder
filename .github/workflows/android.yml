name: Android Buildozer APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk python3-pip autoconf automake cmake build-essential libffi-dev libssl-dev libsqlite3-dev libltdl-dev libtool pkg-config unzip zip
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
      - name: Install Buildozer and Cython
        run: |
          pip3 install --upgrade pip
          pip3 install cython==0.29.37 buildozer
      - name: Build APK
        run: buildozer -v android debug 2>&1 | tee buildozer_build.log
      - name: Locate APK (debug)
        id: locate_apk
        run: |
          APK_PATH=$(ls -1 .buildozer/**/build/outputs/apk/debug/*.apk 2>/dev/null | head -n1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -path "*/debug/*" 2>/dev/null | head -n1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" 2>/dev/null | head -n1)
          fi
          echo "APK_PATH=$APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          ls -la "$APK_PATH" || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pill-reminder-app
          path: ${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: warn
