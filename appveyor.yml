version: 1.0.{build}
image: Ubuntu
environment:
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
  BUILDOZER_DIR: /home/appveyor/.buildozer
install:
  - sudo apt-get update
  - sudo apt-get install -y --no-install-recommends python3-pip autoconf automake cmake build-essential libffi-dev libssl-dev libsqlite3-dev libltdl-dev libtool pkg-config python3-setuptools unzip zip openjdk-17-jdk
  - pip3 install --upgrade pip
  - pip3 install cython==0.29.37 buildozer
build_script:
  - mkdir -p $BUILDOZER_DIR
  - buildozer android debug
artifacts:
  - path: .buildozer/android/platform/build-arm64-v8a/dists/pillreminder/build/outputs/apk/debug/*.apk
    name: pill-reminder-app
